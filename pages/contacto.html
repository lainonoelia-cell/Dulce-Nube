<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Contacto - Dulce Nube</title>
    <meta
      name="description"
      content="Contactate con Dulce Nube para realizar consultas sobre nuestros helados, postres y productos de cafetería."
    />
  </head>

  <body>
    <header>
      <div class="div-logo">
        <a
          class="logo"
          href="../index.html"
          aria-label="Dulce Nube - Ir al inicio"
        ></a>
      </div>

      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="resenas.html">Reseñas</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="carrito.html">Carrito 🛒</a></li>
        </ul>
      </nav>
    </header>
    <div class="div-logo"><a class="logo" href="../index.html">Dulce Nube</a></div>

    <main>
      <section class="contacto">
        <h1 class="titulo-contacto">Contáctanos</h1>

        <form
          class="form-contacto"
          action="https://formspree.io/f/xkjgldeb"
          method="POST"
        >
          <div class="grupo-input">
            <label for="nombre">Nombre:</label>
            <input
              id="nombre"
              type="text"
              name="nombre"
              placeholder="Escribí tu nombre"
              required
            />
          </div>

          <div class="grupo-input">
            <label for="email">Correo electrónico:</label>
            <input
              id="email"
              type="email"
              name="email"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>

          <div class="grupo-input">
            <label for="mensaje">Mensaje:</label>
            <textarea
              id="mensaje"
              name="message"
              placeholder="Escribí tu mensaje"
              required
            ></textarea>
          </div>

          <button class="btn btn-contacto" type="submit">Enviar mensaje</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Dulce Nube - Heladería & Confitería con ❤️ Noe Laino</p>

      <nav>
        <ul class="footer-list">
          <li>
            <a
              href="https://wa.me/5491112345678"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="../img/whatsapp.png" alt="Contactar por WhatsApp"
            /></a>
          </li>

          <li>
            <a
              href="https://www.instagram.com/ig_usuario/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="../img/instagram.png" alt="Visitar Instagram"
            /></a>
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
